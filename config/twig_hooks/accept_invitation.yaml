sylius_twig_hooks:
    hooks:
        'calmfox_admin_invitation.accept_invitation':
            page:
                template: '@SyliusAdmin/security/common/page.html.twig'
                priority: 0

        'calmfox_admin_invitation.accept_invitation.page':
            logo:
                template: '@SyliusAdmin/security/common/logo.html.twig'
                priority: 100
            content:
                template: '@SyliusAdmin/security/common/content.html.twig'
                priority: 0

        'calmfox_admin_invitation.accept_invitation.page.logo':
            image:
                template: '@SyliusAdmin/security/common/logo/image.html.twig'
                priority: 0

        'calmfox_admin_invitation.accept_invitation.page.content':
            header:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/header.html.twig'
                priority: 100
            form:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form.html.twig'
                priority: 0

        'calmfox_admin_invitation.accept_invitation.page.content.form':
            name:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form/name.html.twig'
                priority: 200
            password:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form/password.html.twig'
                priority: 100
            password_generator:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form/password_generator.html.twig'
                priority: 50
            submit:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form/submit.html.twig'
                priority: 0
