sylius_twig_hooks:
    hooks:
        # page behind a password reset link
        'calmfox_admin_invitation.password_reset':
            page:
                template: '@SyliusAdmin/security/common/page.html.twig'
                priority: 0
        'calmfox_admin_invitation.password_reset.page':
            logo:
                template: '@SyliusAdmin/security/common/logo.html.twig'
                priority: 100
            content:
                template: '@SyliusAdmin/security/common/content.html.twig'
                priority: 0
        'calmfox_admin_invitation.password_reset.page.logo':
            image:
                template: '@SyliusAdmin/security/common/logo/image.html.twig'
                priority: 0
        'calmfox_admin_invitation.password_reset.page.content':
            header:
                template: '@CalmfoxSyliusAdminInvitationPlugin/password_reset/page/content/header.html.twig'
                priority: 100
            form:
                template: '@CalmfoxSyliusAdminInvitationPlugin/password_reset/page/content/form.html.twig'
                priority: 0
        'calmfox_admin_invitation.password_reset.page.content.form':
            password:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form/password.html.twig'
                priority: 100
            password_generator:
                template: '@CalmfoxSyliusAdminInvitationPlugin/accept_invitation/page/content/form/password_generator.html.twig'
                priority: 50
            submit:
                template: '@CalmfoxSyliusAdminInvitationPlugin/password_reset/page/content/submit.html.twig'
                priority: 0

        # administrator edit page: "account access" card and its form outside the edit form
        'sylius_admin.admin_user.update.content.form.sections#right':
            calmfox_account_access:
                template: '@CalmfoxSyliusAdminInvitationPlugin/admin/admin_user/update/access_card.html.twig'
                priority: -100
        'sylius_admin.admin_user.update.content':
            calmfox_access_link_form:
                template: '@CalmfoxSyliusAdminInvitationPlugin/admin/admin_user/update/access_link_form.html.twig'
                priority: -100
